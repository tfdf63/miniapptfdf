# Deploy to Beget (static frontend).
# Secrets: BEGET_SSH_KEY
# Variables (or Secrets): VITE_API_URL=/api/v1, VITE_SITE_URL=https://tfdf.ru

name: Deploy to Beget

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || '/api/v1' }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || secrets.VITE_SITE_URL || 'https://tfdf.ru' }}
        run: npm run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BEGET_SSH_KEY }}

      - name: Deploy to Beget
        run: |
          ssh-keyscan -H tfdf63.beget.tech >> ~/.ssh/known_hosts
          # dist includes public/.htaccess + public/api-proxy.php (same-origin /api/v1)
          rsync -avz --delete --omit-dir-times --no-perms --no-owner --no-group --filter='P .ssh/' -e "ssh -o StrictHostKeyChecking=accept-new" \
            dist/ tfdf63_tfdf@tfdf63.beget.tech:./
